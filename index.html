<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>にしやん工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFC400;        /* ゼッケンの黄色 */
    --text: #141B2D;
    --sub: #4A4320;
    --line: #141B2D;      /* イラストの線 */
    --tire: #141B2D;
    --fairing: #FFFFFF;
    --plate: #FFC400;
    --helmet: #FFFFFF;
    --suit: #D8342B;
    --metal: #8A8F9C;
    --glass: rgba(20, 27, 45, .28);
    --kerb: #D8342B;
    --asphalt: #141B2D;
    --asphalt-text: #C9CEDD;
    --btn-bg: #141B2D;
    --btn-text: #FFC400;
    --btn-shadow: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #141B2D;
      --text: #FFC400;
      --sub: #C9CEDD;
      --line: #F6F3E7;
      --tire: #05080F;
      --fairing: #FFC400;
      --plate: #F6F3E7;
      --helmet: #F6F3E7;
      --glass: rgba(246, 243, 231, .25);
      --asphalt: #0A0E19;
      --btn-bg: #FFC400;
      --btn-text: #141B2D;
      --btn-shadow: #D8342B;
    }
  }

  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    overflow-x: clip;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    font-weight: 500;
    line-height: 1.7;
  }

  .wrap {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 56px);
  }

  main { flex: 1; display: flex; flex-direction: column; }

  .masthead { padding-top: clamp(40px, 9vh, 96px); }
  .masthead h1 {
    margin: 0;
    font-family: "Dela Gothic One", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    font-weight: 400;
    font-size: clamp(3rem, 14vw, 9rem);
    line-height: 1.08;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .masthead p {
    margin: .9rem 0 0;
    font-size: clamp(1rem, 2.2vw, 1.25rem);
    font-weight: 700;
    color: var(--sub);
  }

  .work {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
    align-items: end;
    gap: clamp(16px, 4vw, 48px);
    padding-top: clamp(32px, 7vh, 72px);
  }
  .work-text { padding-bottom: clamp(28px, 6vh, 56px); }
  .work-text h2 {
    margin: 0;
    font-family: "Dela Gothic One", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    font-weight: 400;
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    line-height: 1.2;
  }
  .work-text p { margin: .4rem 0 1.4rem; color: var(--sub); font-weight: 700; }

  .btn {
    display: inline-block;
    padding: .85em 1.7em;
    font-family: "Dela Gothic One", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    font-size: clamp(1.1rem, 2.4vw, 1.4rem);
    line-height: 1.2;
    text-decoration: none;
    color: var(--btn-text);
    background: var(--btn-bg);
    border-radius: 10px;
    box-shadow: 5px 5px 0 var(--btn-shadow);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--btn-shadow); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--btn-shadow); }
  .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }

  .rider { display: block; width: 100%; height: auto; animation: ride-in .9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes ride-in {
    from { transform: translateX(22%); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rider { animation: none; }
    .btn { transition: none; }
  }

  /* 写真 */
  .photo {
    margin-bottom: clamp(20px, 4vh, 36px);
    border: 3px solid var(--line);
    border-radius: 10px;
    box-shadow: 8px 8px 0 var(--btn-shadow);
    object-fit: cover;
  }

  /* 縁石 */
  .kerb {
    height: 24px;
    border-top: 3px solid var(--line);
    background: repeating-linear-gradient(90deg, var(--kerb) 0 64px, #FFFFFF 64px 128px);
  }
  footer { background: var(--asphalt); color: var(--asphalt-text); font-size: .875rem; }
  footer .wrap { padding-top: 18px; padding-bottom: 22px; }

  @media (max-width: 720px) {
    .work { grid-template-columns: 1fr; gap: 0; }
    .work-text { padding-bottom: 20px; }
  }
</style>
</head>
<body>
<main>
  <header class="wrap masthead">
    <h1>にしやん工房</h1>
    <p>つくったものを、ここに置いています。</p>
  </header>

  <section class="wrap work">
    <div class="work-text">
      <h2>HangOff</h2>
      <p>HangOffの設定ページです。</p>
      <a class="btn" href="/hangoff/">HangOff設定を開く</a>
    </div>

    <img class="rider photo" src="rider.png" alt="バイクのライダーがハングオフでコーナーを曲がるイラスト">
  </section>
</main>

<div class="kerb" aria-hidden="true"></div>
<footer>
  <div class="wrap">westisland.jp</div>
</footer>
</body>
</html>
